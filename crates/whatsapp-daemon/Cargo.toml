[package]
name = "whatsapp-daemon"
version = "0.1.0"
edition = "2024"

# Protocol crates on the 0.7 line: the first one with VoIP (audio/video calls). 0.7 ships its own
# default transport / HTTP client / runtime, so those crates are no longer listed here.
# voip-mlow = calling runtime + the pure-Rust MLOW codec (no libopus / C toolchain needed).
[dependencies]
whatsapp-rust = { version = "0.7", features = ["voip-mlow"] }
wacore = "0.7"
waproto = "0.7" # wa::Message (protobuf types, generated with buffa since 0.7)
buffa = "0.9" # decode the on-demand history blob (replaces prost)
cpal = "0.15" # microphone / speaker for calls (ALSA, PulseAudio, PipeWire)
async-channel = "2" # carries audio frames to and from the call engine
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Same SQLite binding the protocol crate already uses (a second one would clash on libsqlite3-sys).
diesel = { version = "2.3", default-features = false, features = ["sqlite"] }
diesel_migrations = { version = "2.3", default-features = false, features = ["sqlite"] }
notify-rust = "4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
base64 = "0.22"
# Decode the on-demand history blob ourselves (zlib + protobuf).
